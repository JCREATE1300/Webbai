name: Build Windows installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Build the web app (Vite output goes to dist/)
      - name: Install web deps
        run: bun install --frozen-lockfile

      - name: Build web app
        run: bun run build

      # Build the Electron installer
      - name: Install electron deps
        working-directory: electron
        run: npm install --no-audit --no-fund

      - name: Install electron-builder
        working-directory: electron
        run: npm install --no-save electron-builder@^25.0.0

      - name: Bundle Ollama runtime (local Gemma 4)
        shell: pwsh
        working-directory: electron
        run: |
          New-Item -ItemType Directory -Force -Path vendor/ollama | Out-Null
          Invoke-WebRequest -Uri "https://ollama.com/download/ollama-windows-amd64.zip" -OutFile ollama.zip
          Expand-Archive -Path ollama.zip -DestinationPath vendor/ollama -Force
          Remove-Item ollama.zip
          if (-not (Test-Path vendor/ollama/ollama.exe)) { throw "ollama.exe missing from runtime zip" }
          Get-ChildItem -Recurse vendor/ollama | Select-Object -First 30

      - name: Build Windows NSIS installer
        working-directory: electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --publish never

      - name: Verify installer output
        shell: pwsh
        working-directory: electron/release
        run: |
          if (-not (Test-Path webbai-windows.exe)) { throw "Installer was not produced" }
          Get-ChildItem

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: webbai-windows
          path: |
            electron/release/webbai-windows.exe
            electron/release/webbai-windows.exe.blockmap
            electron/release/latest.yml

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            electron/release/webbai-windows.exe
            electron/release/webbai-windows.exe.blockmap
            electron/release/latest.yml
