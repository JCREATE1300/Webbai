name: Build Windows installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Build the web app (Vite output goes to dist/)
      - name: Install web deps
        run: bun install --frozen-lockfile

      - name: Build web app
        run: bun run build

      # Build the Electron installer
      - name: Install electron deps
        working-directory: electron
        run: npm install --no-audit --no-fund

      - name: Install electron-builder
        working-directory: electron
        run: npm install --no-save electron-builder@^25.0.0

      - name: Build Windows NSIS installer
        working-directory: electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --publish never

      - name: Rename installer
        shell: pwsh
        working-directory: electron/release
        run: |
          $exe = Get-ChildItem -Filter *.exe | Select-Object -First 1
          if ($exe) { Rename-Item $exe.FullName "webbai-windows.exe" }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: webbai-windows
          path: electron/release/webbai-windows.exe

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: electron/release/webbai-windows.exe
